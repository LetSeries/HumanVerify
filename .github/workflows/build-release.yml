name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git log --oneline -3

      - name: Compute next patch version
        id: version
        run: python3 .github/scripts/next-version.py "$GITHUB_RUN_NUMBER"

      - name: Set pom version
        run: |
          python3 .github/scripts/next-version.py --write "${{ steps.version.outputs.new }}"
          git diff -- pom.xml | head -n 30

      - name: Build (tests included)
        run: mvn -B clean package

      - name: Verify jar and plugin.yml version
        run: |
          NEW="${{ steps.version.outputs.new }}"
          JAR="target/HumanVerify-${NEW}.jar"
          test -f "$JAR" || { echo "Expected jar not found: $JAR"; exit 1; }
          unzip -p "$JAR" plugin.yml > /tmp/plugin.yml
          cat /tmp/plugin.yml | head -n 8
          grep -q "version: '${NEW}'" /tmp/plugin.yml \
            || { echo "plugin.yml version mismatch (expected ${NEW})"; exit 1; }
          echo "Jar and plugin.yml version OK: ${NEW}"

      - name: Commit version bump [skip ci]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if git diff --cached --quiet; then
            echo "No pom changes to commit."
          else
            git commit -m "chore(release): bump version to ${{ steps.version.outputs.new }} [skip ci]"
            PUSHED=false
            for i in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then PUSHED=true; break; fi
              else
                git rebase --abort
              fi
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PUSHED" != "true" ]; then
              echo "Failed to push version bump after 3 attempts."
              exit 1
            fi
          fi

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW="${{ steps.version.outputs.new }}"
          TAG="${{ steps.version.outputs.tag }}"
          JAR="target/HumanVerify-${NEW}.jar"
          ls -la target/
          test -f "$JAR" || { echo "Expected jar not found: $JAR"; exit 1; }
          cp "$JAR" "HumanVerify-${NEW}.jar"
          sha256sum "HumanVerify-${NEW}.jar" | tee "HumanVerify-${NEW}.jar.sha256"
          git fetch origin main
          git tag "$TAG" origin/main
          git push origin "$TAG"
          SHA=$(git rev-parse --short origin/main)
          PREV_TAG=$(git describe --tags --abbrev=0 origin/main^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:"
            CHANGELOG=$(git log --pretty='- %s (%h)' "$PREV_TAG"..origin/main)
          else
            CHANGELOG=$(git log --pretty='- %s (%h)' -10 origin/main)
          fi
          {
            echo "Auto release for ${SHA} (pom ${{ steps.version.outputs.current }} -> ${NEW})"
            echo ""
            echo "### Changes"
            echo "$CHANGELOG"
          } > release-notes.md
          cat release-notes.md
          gh release create "$TAG" \
            --title "HumanVerify $TAG" \
            --notes-file release-notes.md \
            "HumanVerify-${NEW}.jar" \
            "HumanVerify-${NEW}.jar.sha256"
