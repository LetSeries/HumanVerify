name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git log --oneline -3

      - name: Compute next patch version
        id: version
        run: |
          python3 .github/scripts/next-version.py "$GITHUB_RUN_NUMBER" | tee version.env
          {
            echo "current=$(grep '^current=' version.env | cut -d= -f2)"
            echo "new=$(grep '^new=' version.env | cut -d= -f2)"
            echo "tag=$(grep '^tag=' version.env | cut -d= -f2)"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Set pom version
        run: |
          NEW="${{ steps.version.outputs.new }}"
          python3 - "$NEW" <<'PY'
          import re, sys
          new = sys.argv[1]
          with open("pom.xml", encoding="utf-8") as fh:
              pom = fh.read()
          pom, n = re.subn(r"<version>[^<]+</version>", f"<version>{new}</version>", pom, count=1)
          if n != 1:
              raise SystemExit("failed to update pom version")
          with open("pom.xml", "w", encoding="utf-8") as fh:
              fh.write(pom)
          print(f"pom version -> {new}")
          PY
          git diff -- pom.xml | head -n 30

      - name: Build (tests included)
        run: mvn -B package

      - name: Commit version bump [skip ci]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if git diff --cached --quiet; then
            echo "No pom changes to commit."
          else
            git commit -m "chore(release): bump version to ${{ steps.version.outputs.new }} [skip ci]"
            PUSHED=false
            for i in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then PUSHED=true; break; fi
              else
                git rebase --abort
              fi
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
            if [ "$PUSHED" != "true" ]; then
              echo "Failed to push version bump after 3 attempts."
              exit 1
            fi
          fi

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW="${{ steps.version.outputs.new }}"
          TAG="${{ steps.version.outputs.tag }}"
          JAR="target/HumanVerify-${NEW}.jar"
          ls -la target/
          test -f "$JAR" || { echo "Expected jar not found: $JAR"; exit 1; }
          cp "$JAR" "HumanVerify-${NEW}.jar"
          git fetch origin main
          git tag "$TAG" origin/main
          git push origin "$TAG"
          SHA=$(git rev-parse --short origin/main)
          PREV_TAG=$(git describe --tags --abbrev=0 origin/main^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:"
            CHANGELOG=$(git log --pretty='- %s (%h)' "$PREV_TAG"..origin/main)
          else
            CHANGELOG=$(git log --pretty='- %s (%h)' -10 origin/main)
          fi
          {
            echo "Auto release for ${SHA} (pom ${{ steps.version.outputs.current }} -> ${NEW})"
            echo ""
            echo "### Changes"
            echo "$CHANGELOG"
          } > release-notes.md
          cat release-notes.md
          gh release create "$TAG" \
            --title "HumanVerify $TAG" \
            --notes-file release-notes.md \
            "HumanVerify-${NEW}.jar"
